<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#193c30"><title>Web Bar 管理系统</title><style>
:root{--green:#193c30;--gold:#d69b4c;--paper:#f5f2eb;--ink:#1e2823;--muted:#66736c;--line:#dce2dc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--green);color:white;padding:16px max(16px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:20px}main{max-width:1100px;margin:22px auto;padding:0 14px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #172b2010}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font-size:13px;color:var(--muted)}input,select,textarea,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #cbd5cc;background:white;color:inherit;max-width:100%}button{cursor:pointer;background:var(--green);color:white;border-color:var(--green)}button.secondary{background:white;color:var(--green)}button.gold{background:var(--gold);border-color:var(--gold);color:#241b0e}button:disabled{opacity:.5}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tabs button{background:#e4e9e3;color:var(--green);border:0}.tabs button.active{background:var(--green);color:white}.muted{color:var(--muted)}.hidden{display:none!important}.notice{padding:10px 12px;background:#fff4d9;border-radius:8px;margin:12px 0}.success{background:#e5f4e8}.error{background:#ffe7e4}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted)}td input,td select{min-width:100px;width:100%}.stat{font-size:25px;font-weight:700;color:var(--green)}.status{display:inline-block;background:#e8eee8;color:#234434;padding:3px 8px;border-radius:999px;font-size:12px}.small{font-size:12px}@media(max-width:600px){main{margin:10px auto;padding:0 8px}.panel{padding:13px}header{padding:13px}}
</style></head><body><header><strong>🍸 Web Bar</strong><div class="row"><span id="who" class="small"></span><button id="logout" class="secondary hidden" onclick="logout()">退出登录</button></div></header><main><div id="message" class="notice hidden"></div><section id="auth" class="panel"><h2>登录 / 注册</h2><p class="muted">注册需要手机号、昵称和密码；不发送短信验证码。</p><div class="grid"><div class="field"><label>手机号</label><input id="phone" autocomplete="tel" placeholder="手机号（必填）"></div><div class="field"><label>密码（至少 10 位）</label><input id="password" type="password" autocomplete="current-password" placeholder="密码"></div><div class="field" id="nickField"><label>注册昵称</label><input id="nickname" placeholder="昵称"></div></div><div class="row"><button onclick="login()">登录</button><button class="gold" onclick="register()">注册顾客账号</button></div><p class="small muted">管理员账号需在托管后台配置 ADMIN_PHONE 和 ADMIN_PASSWORD 后登录。请勿使用演示密码。</p></section><section id="app" class="hidden"><div class="tabs" id="tabs"></div><div id="view"></div><p class="small muted">桌位状态约每 5 秒刷新一次。请勿在公共设备上保存密码。</p></section></main><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('wb_token')||'',me=null,active='tables',poller=null;const adminTabs=[['tables','桌位状态'],['drinks','酒水库存'],['bookings','订桌记录'],['customers','顾客'],['wallets','线下充值确认'],['logs','操作日志']];const customerTabs=[['tables','桌位状态/订桌'],['bookings','我的订桌'],['drinks','酒水清单'],['wallet','我的钱包']];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toFixed(2)}function show(s,type=''){ $('message').textContent=s;$('message').className='notice '+type;setTimeout(()=>{$('message').classList.add('hidden')},4500)}async function api(path,method='GET',body){let base=window.WEBBAR_API_BASE||'';if(!base||base.includes('REPLACE-WITH'))throw Error('请先在 frontend/config.js 中填写部署后的后台 API 地址。');let r=await fetch(base+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});let x;try{x=await r.json()}catch{x={detail:'服务器返回非 JSON 响应'}}if(!r.ok)throw Error(x.detail||x.message||'请求失败');return x}
async function login(){try{let x=await api('/api/auth/login','POST',{phone:$('phone').value,password:$('password').value});setSession(x)}catch(e){show(e.message,'error')}}async function register(){try{let x=await api('/api/auth/register','POST',{phone:$('phone').value,nickname:$('nickname').value,password:$('password').value});setSession(x)}catch(e){show(e.message,'error')}}function setSession(x){token=x.token;me=x.user;localStorage.setItem('wb_token',token);$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('who').textContent=me.nickname+' · '+(me.role==='admin'?'管理员':'顾客');$('tabs').innerHTML=(me.role==='admin'?adminTabs:customerTabs).map(([id,n])=>`<button id="tab-${id}" onclick="load('${id}')">${n}</button>`).join('');load(me.role==='admin'?'tables':'tables');if(poller)clearInterval(poller);poller=setInterval(()=>{if(active==='tables')load('tables',true)},5000)}function logout(){token='';me=null;localStorage.removeItem('wb_token');if(poller)clearInterval(poller);$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('logout').classList.add('hidden');$('who').textContent=''}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="muted">暂无记录</td></tr>`}</tbody></table></div>`}function tr(xs){return `<tr>${xs.map(x=>`<td>${x??''}</td>`).join('')}</tr>`}async function load(tab,silent=false){active=tab;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id==='tab-'+tab));if(!silent)$('view').innerHTML='<div class="panel">加载中…</div>';try{let html='';if(tab==='tables'){let xs=await api('/api/tables');if(me.role==='admin'){html=`<div class="panel"><h2>桌位实时状态</h2><p class="muted">修改后会立即保存，其他设备约 5 秒内刷新。</p>${table(['桌位','容量','当前状态','操作'],xs.map(t=>tr([esc(t.name),t.capacity,`<span class="status">${esc(t.status)}</span>`,`<select id="ts${t.id}">${['空闲','使用中','已预订','暂停使用'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select> <button onclick="saveTable(${t.id},${t.capacity})">保存状态</button>`])))}</div>`}else{let opts=xs.filter(t=>t.status==='空闲').map(t=>`<option value="${t.id}">${esc(t.name)} · 容量${t.capacity}</option>`).join('');html=`<div class="panel"><h2>桌位状态</h2><div class="grid">${xs.map(t=>`<div class="panel"><h3>${esc(t.name)}</h3><p>容量：${t.capacity} 人</p><span class="status">${esc(t.status)}</span></div>`).join('')}</div><h2>预订桌位（不收订金）</h2><div class="grid"><div class="field"><label>选择空闲桌位</label><select id="bookTable">${opts}</select></div><div class="field"><label>到店时间</label><input id="bookTime" type="datetime-local"></div><div class="field"><label>人数</label><input id="party" type="number" min="1" max="30" value="2"></div></div><button onclick="book()" ${opts?'':'disabled'}>提交订桌</button></div>`}}else if(tab==='drinks'){let xs=await api('/api/drinks');html=`<div class="panel"><h2>酒水清单 / 库存</h2>${me.role==='admin'?`<div class="grid"><div class="field"><label>酒水名称</label><input id="drinkName"></div><div class="field"><label>库存数量</label><input id="drinkStock" type="number" min="0" value="0"></div></div><button onclick="addDrink()">新增酒水</button><hr>`:''}${table(['名称','库存','状态',...(me.role==='admin'?['修改']:[])],xs.map(d=>tr([esc(d.name),d.stock,d.active?'在售':'停用',...(me.role==='admin'?[`<div class="row"><input id="dn${d.id}" value="${esc(d.name)}" aria-label="酒水名称"><input id="ds${d.id}" type="number" min="0" value="${d.stock}" aria-label="库存"><select id="da${d.id}"><option value="true" ${d.active?'selected':''}>在售</option><option value="false" ${!d.active?'selected':''}>停用</option></select><button onclick="saveDrink(${d.id})">保存</button></div>`]:[])])))}</div>`}else if(tab==='bookings'){let xs=await api('/api/bookings');html=`<div class="panel"><h2>${me.role==='admin'?'全部订桌记录':'我的订桌'}</h2>${table(['编号','顾客','手机号','桌位','到店时间','人数','状态',...(me.role==='admin'?['更新状态']:[])],xs.map(b=>tr([b.id,esc(b.customer||''),esc(b.phone||''),esc(b.table_name),new Date(b.booking_time).toLocaleString(),b.party_size,esc(b.status),...(me.role==='admin'?[`<select id="bs${b.id}">${['待确认','已确认','已到店','取消','爽约'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="saveBooking(${b.id})">保存</button>`]:[])])))}</div>`}else if(tab==='customers'){let xs=await api('/api/admin/customers');html=`<div class="panel"><h2>顾客列表</h2>${table(['ID','昵称','手机号','状态','注册时间'],xs.map(u=>tr([u.id,esc(u.nickname),esc(u.phone),u.active?'正常':'停用',new Date(u.created_at).toLocaleString()])))}</div>`}else if(tab==='wallets'){let xs=await api('/api/admin/wallets');html=`<div class="panel"><h2>线下充值确认</h2><p class="muted">必须先核实现金/微信/支付宝实际到账，再手动确认；确认后会立即增加余额并记录操作。</p>${table(['顾客','手机号','当前余额','确认充值金额','收款方式','备注','操作'],xs.map(u=>tr([esc(u.nickname),esc(u.phone),'¥'+money(u.balance),`<input id="wa${u.user_id}" type="number" min="0.01" step="0.01" value="100">`,`<select id="wm${u.user_id}"><option>现金</option><option>微信线下收款</option><option>支付宝线下收款</option><option>其他</option></select>`,`<input id="wr${u.user_id}" placeholder="可选备注">`,`<button onclick="confirmRecharge(${u.user_id})">已核实到账，确认</button>`])))}</div>`}else if(tab==='wallet'){let x=await api('/api/me'),xs=await api('/api/wallet/transactions');html=`<div class="panel"><h2>我的钱包</h2><div class="stat">¥${money(x.wallet_balance)}</div><p class="muted">线下充值请联系店员；店员核实到账后会手动更新余额。</p>${table(['时间','类型','金额','方式','备注'],xs.map(t=>tr([new Date(t.created_at).toLocaleString(),esc(t.kind),'¥'+money(t.amount),esc(t.method),esc(t.remark)])))}</div>`}else if(tab==='logs'){let xs=await api('/api/admin/audit-logs');html=`<div class="panel"><h2>操作日志</h2>${table(['时间','操作人ID','操作','对象','详情'],xs.map(a=>tr([new Date(a.created_at).toLocaleString(),a.actor_id,esc(a.action),esc(a.entity)+' #'+a.entity_id,esc(a.detail)])))}</div>`}$('view').innerHTML=html}catch(e){if(!silent)$('view').innerHTML=`<div class="panel notice error">${esc(e.message)}</div>`;else if(e.message.includes('登录'))logout()}}
async function saveTable(id,capacity){try{await api('/api/admin/tables/'+id,'PATCH',{status:$('ts'+id).value,capacity});show('桌位状态已更新','success');load('tables')}catch(e){show(e.message,'error')}}async function addDrink(){try{await api('/api/admin/drinks','POST',{name:$('drinkName').value,stock:Number($('drinkStock').value),active:true});show('酒水已新增','success');load('drinks')}catch(e){show(e.message,'error')}}async function saveDrink(id){try{await api('/api/admin/drinks/'+id,'PATCH',{name:$('dn'+id).value,stock:Number($('ds'+id).value),active:$('da'+id).value==='true'});show('酒水名称和库存已保存','success');load('drinks')}catch(e){show(e.message,'error')}}async function book(){try{let dt=new Date($('bookTime').value);if(!Number.isFinite(dt.getTime()))throw Error('请选择到店时间');await api('/api/bookings','POST',{table_id:Number($('bookTable').value),booking_time:dt.toISOString(),party_size:Number($('party').value)});show('订桌已提交，不收订金','success');load('bookings')}catch(e){show(e.message,'error')}}async function saveBooking(id){try{await api('/api/admin/bookings/'+id+'?status='+encodeURIComponent($('bs'+id).value),'PATCH');show('订桌状态已更新','success');load('bookings')}catch(e){show(e.message,'error')}}async function confirmRecharge(id){if(!confirm('请确认已经核实实际到账。确认后将增加顾客钱包余额，且会留下操作记录。'))return;try{await api('/api/admin/wallets/'+id+'/confirm-offline-recharge','POST',{amount:$('wa'+id).value,method:$('wm'+id).value,remark:$('wr'+id).value});show('已确认线下收款并更新余额','success');load('wallets')}catch(e){show(e.message,'error')}}
(async()=>{if(token){try{let x=await api('/api/me');me=x;setSession({token,user:x})}catch{logout()}}})();
</script></body></html>
